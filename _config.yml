# Hexo 站点配置
# Docs: https://hexo.io/docs/configuration.html

## Site
title: YangBao
subtitle: 知识笔记
description: Java / 大数据 / 中间件 技术笔记
keywords: Java,Spring,MyBatis,JVM,大数据,Spark,Kafka,Redis
author: ruY9527
language: zh-CN
timezone: Asia/Shanghai

## URL
url: https://ruy9527.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

## Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

## Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  enable: true
  line_number: false
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false

## Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

## Category & Tag
default_category: uncategorized
category_map:
tag_map:

## Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime

## Pagination
per_page: 10
pagination_dir: page

## Extensions
theme: butterfly

# 本地搜索 (hexo-generator-searchdb)
search:
  path: search.xml
  field: post
  content: true
  format: html

# RSS (hexo-generator-feed)
feed:
  enable: true
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content: true
  content_limit: 140
  content_limit_delim: ' '
  order_by: -date
